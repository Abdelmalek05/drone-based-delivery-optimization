[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronevrp"
version = "1.0.0"
description = "Energy-optimal drone delivery routing over Algiers: branch and bound, genetic algorithm, and simulated annealing for a battery-, payload- and no-fly-zone-constrained VRP"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Abdelmalek Nedjar" }]
keywords = ["optimization", "vehicle-routing-problem", "metaheuristics",
            "genetic-algorithm", "simulated-annealing", "branch-and-bound"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.11", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pyflakes>=3.0"]
notebook = ["jupyterlab>=4.0"]

[project.scripts]
dronevrp = "dronevrp.cli:main"

[project.urls]
Homepage = "https://github.com/Abdelmalek05/Drone-Based-delivery-optimization"
Presentation = "https://nmo-presentation.vercel.app/"

[tool.setuptools.packages.find]
include = ["dronevrp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
